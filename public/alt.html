<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Request CRM</title>
  <!-- Alternative UI, based on the Stitch "AeroDesk Core" design. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0B192C', soft: '#1E3E62' },
            sky: { DEFAULT: '#008DDA', dark: '#0077B8' },
            amber: { DEFAULT: '#FFB200' },
            canvas: '#F4F7FB',
            tint: '#E8F1F5',
            line: '#E1E8F0',
            muted: '#5A6E85',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            card: '0 4px 16px -2px rgba(11,25,44,.04), 0 2px 6px -1px rgba(11,25,44,.02)',
          },
        },
      },
    };
  </script>
  <style>
    .field:focus-within { border-color: #008DDA; box-shadow: 0 0 0 3px rgba(0,141,218,.15); }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #5A6E85; }
    .code { letter-spacing: .04em; }
  </style>
</head>
<body class="min-h-screen bg-canvas text-navy antialiased font-sans">

  <header class="bg-white border-b border-line">
    <div class="max-w-6xl mx-auto px-4 sm:px-7 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-navy text-sky grid place-items-center">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 19h19v2h-19zM22.07 9.64c-.21-.8-1.04-1.28-1.84-1.06L14.92 10 8 3.57l-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49 16.6-4.45c.81-.22 1.28-1.04 1.06-1.83z"/></svg>
        </div>
        <div class="leading-tight">
          <p class="font-display font-bold text-lg">Flight Request CRM</p>
          <p class="text-xs text-muted">Booking request desk</p>
        </div>
      </div>
      <a href="/" class="text-sm text-sky hover:text-sky-dark font-medium">Classic view</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-7 py-8 space-y-10">

    <!-- New request -->
    <section class="bg-white rounded-2xl border border-line shadow-card overflow-hidden">
      <div class="h-1 bg-gradient-to-r from-navy via-sky to-sky"></div>
      <div class="p-5 sm:p-8">
        <div class="flex items-center gap-3 pb-5 mb-6 border-b border-line">
          <div class="h-10 w-10 rounded-lg bg-tint text-sky grid place-items-center">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-3-3-3M12 15h5"/></svg>
          </div>
          <h1 class="font-display font-semibold text-2xl">New Flight Request</h1>
        </div>

        <form id="request-form" novalidate class="space-y-6">
          <!-- Route row -->
          <div class="grid gap-4 lg:grid-cols-[1fr_auto_1fr_1fr_auto] lg:items-end">
            <div>
              <label for="origin" class="label block mb-2">Origin</label>
              <div class="field flex items-center gap-3 rounded-lg border border-line px-3 h-14 transition">
                <svg class="h-5 w-5 text-muted shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 19h19v2h-19zM22.07 9.64c-.21-.8-1.04-1.28-1.84-1.06L14.92 10 8 3.57l-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49 16.6-4.45c.81-.22 1.28-1.04 1.06-1.83z"/></svg>
                <input id="origin" name="origin" type="text" required autocomplete="off" placeholder="e.g. TLV"
                  class="w-full bg-transparent outline-none font-mono font-semibold code placeholder:font-sans placeholder:font-normal placeholder:text-muted" />
              </div>
            </div>

            <button type="button" id="swap" title="Swap origin and destination" aria-label="Swap origin and destination"
              class="justify-self-center h-11 w-11 rounded-full border border-line bg-canvas text-navy grid place-items-center hover:bg-tint transition lg:mb-1.5 rotate-90 lg:rotate-0">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 16h13M17 12l3 4-3 4M17 8H4M7 4L4 8l3 4"/></svg>
            </button>

            <div>
              <label for="destination" class="label block mb-2">Destination</label>
              <div class="field flex items-center gap-3 rounded-lg border border-line px-3 h-14 transition">
                <svg class="h-5 w-5 text-muted shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 19h19v2h-19zM9.68 13.27l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-5.31-1.42-2.76-9.02L10.12 2v8.28L5.15 8.95l-.93-2.32-1.45-.39v5.17l1.6.43 5.31 1.43z"/></svg>
                <input id="destination" name="destination" type="text" required autocomplete="off" placeholder="e.g. JFK"
                  class="w-full bg-transparent outline-none font-mono font-semibold code placeholder:font-sans placeholder:font-normal placeholder:text-muted" />
              </div>
            </div>

            <div>
              <label for="departureDate" class="label block mb-2">Departure date</label>
              <div class="field flex items-center rounded-lg border border-line px-3 h-14 transition">
                <input id="departureDate" name="departureDate" type="date" required
                  class="w-full bg-transparent outline-none" />
              </div>
            </div>

            <div>
              <label for="passengers" class="label block mb-2">Passengers</label>
              <div class="flex items-center justify-between gap-2 rounded-lg border border-line px-2 h-14 lg:w-40">
                <button type="button" data-step="-1" aria-label="Fewer passengers"
                  class="h-10 w-10 rounded-md bg-tint hover:bg-[#DCE8EF] font-semibold text-lg disabled:opacity-40">−</button>
                <div class="text-center leading-tight">
                  <input id="passengers" name="passengers" type="number" min="1" max="9" value="1" readonly
                    class="w-10 text-center bg-transparent outline-none font-semibold text-lg [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none" />
                  <p class="text-[11px] text-muted -mt-1">max 9</p>
                </div>
                <button type="button" data-step="1" aria-label="More passengers"
                  class="h-10 w-10 rounded-md bg-tint hover:bg-[#DCE8EF] font-semibold text-lg disabled:opacity-40">+</button>
              </div>
            </div>
          </div>

          <!-- Customer row -->
          <div class="grid gap-4 lg:grid-cols-[1.3fr_1fr_auto] lg:items-end">
            <div>
              <label for="customerName" class="label block mb-2">Customer full name</label>
              <div class="field flex items-center gap-3 rounded-lg border border-line px-3 h-14 transition">
                <svg class="h-5 w-5 text-muted shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input id="customerName" name="customerName" type="text" required autocomplete="off" placeholder="e.g. Dana Cohen"
                  class="w-full bg-transparent outline-none placeholder:text-muted" />
              </div>
            </div>
            <div>
              <label for="phone" class="label block mb-2">Phone number</label>
              <div class="field flex items-center gap-3 rounded-lg border border-line px-3 h-14 transition">
                <svg class="h-5 w-5 text-muted shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
                <input id="phone" name="phone" type="tel" required autocomplete="off" placeholder="e.g. +972 50-123-4567"
                  class="w-full bg-transparent outline-none placeholder:text-muted" />
              </div>
            </div>
            <button type="submit"
              class="h-14 px-8 rounded-lg bg-navy hover:bg-navy-soft text-white font-display font-semibold text-lg inline-flex items-center justify-center gap-3 transition disabled:opacity-60">
              Create Request
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
            </button>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3">
            <p class="flex items-center gap-2 text-sm italic text-muted">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              Requests are final and cannot be edited or deleted.
            </p>
            <p id="form-message" class="hidden text-sm rounded-lg px-3 py-2" role="status"></p>
          </div>
        </form>
      </div>
    </section>

    <!-- Requests list -->
    <section>
      <div class="flex items-center gap-3 mb-5">
        <h2 class="font-display font-semibold text-2xl">Flight Requests</h2>
        <span id="request-count" class="text-xs font-semibold text-sky bg-tint border border-line rounded-full px-3 py-1">0 requests</span>
      </div>
      <div id="empty-state" class="bg-white rounded-2xl border border-dashed border-line p-12 text-center text-muted">
        No requests yet. Create the first one above.
      </div>
      <ul id="request-list" class="space-y-5"></ul>
    </section>
  </main>

  <script src="alt.js"></script>
</body>
</html>
