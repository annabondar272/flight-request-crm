<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Request CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-3">
      <div class="h-9 w-9 rounded-lg bg-sky-600 text-white grid place-items-center text-lg">✈</div>
      <div>
        <h1 class="text-lg font-semibold leading-tight">Flight Request CRM</h1>
        <p class="text-xs text-slate-500">Educational booking request system</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid gap-6 lg:grid-cols-5">
    <!-- Create form -->
    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 h-fit">
      <h2 class="text-base font-semibold mb-1">New Flight Request</h2>
      <p class="text-sm text-slate-500 mb-5">Requests can't be edited or deleted after you submit them.</p>

      <form id="request-form" class="space-y-4" novalidate>
        <div>
          <label for="customerName" class="block text-sm font-medium mb-1">Customer Name</label>
          <input id="customerName" name="customerName" type="text" required autocomplete="off"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium mb-1">Phone Number</label>
          <input id="phone" name="phone" type="tel" required autocomplete="off" placeholder="+1 555 123 4567"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="origin" class="block text-sm font-medium mb-1">Origin</label>
            <input id="origin" name="origin" type="text" required autocomplete="off" placeholder="e.g. JFK"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
          </div>
          <div>
            <label for="destination" class="block text-sm font-medium mb-1">Destination</label>
            <input id="destination" name="destination" type="text" required autocomplete="off" placeholder="e.g. LHR"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="departureDate" class="block text-sm font-medium mb-1">Departure Date</label>
            <input id="departureDate" name="departureDate" type="date" required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
          </div>
          <div>
            <label for="passengers" class="block text-sm font-medium mb-1">Passengers</label>
            <input id="passengers" name="passengers" type="number" min="1" max="9" value="1" required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" />
          </div>
        </div>

        <p id="form-message" class="hidden text-sm rounded-lg px-3 py-2"></p>

        <button type="submit"
          class="w-full rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium py-2.5 transition-colors disabled:opacity-60">
          Create Request
        </button>
      </form>
    </section>

    <!-- Requests list -->
    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold">Flight Requests</h2>
        <span id="request-count" class="text-xs font-medium bg-slate-100 text-slate-600 rounded-full px-2.5 py-1">0</span>
      </div>
      <div id="empty-state" class="text-center py-12 text-sm text-slate-500">
        No requests yet. Create one with the form.
      </div>
      <ul id="request-list" class="space-y-3"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
